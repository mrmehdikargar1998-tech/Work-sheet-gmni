<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت ورود و خروج</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; color: #333; }
        .card { background: #ffffff; width: 100%; max-width: 420px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); padding: 24px; display: flex; flex-direction: column; gap: 18px; }
        .title-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
        .title-container h1 { font-size: 1.5rem; font-weight: 800; color: #1a1a1a; }
        .title-icon { font-size: 1.8rem; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .label-row { display: flex; justify-content: space-between; align-items: center; }
        label { font-size: 0.9rem; font-weight: 700; color: #4a5568; display: flex; align-items: center; gap: 6px; }
        .quick-btn { background: #edf2f7; border: none; color: #2b6cb0; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        input { width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 1rem; text-align: center; outline: none; background-color: #fafafa; }
        input:focus { border-color: #3182ce; background-color: #fff; }
        .btn-submit { background-color: #2563eb; color: white; border: none; border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 5px; }
        .history-section { margin-top: 10px; border-top: 2px dashed #e2e8f0; padding-top: 15px; }
        .history-title { font-weight: 700; font-size: 1rem; margin-bottom: 10px; color: #2d3748; display: flex; justify-content: space-between; align-items: center; }
        .history-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { background: #f7fafc; border: 1px solid #edf2f7; border-radius: 10px; padding: 10px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        .btn-delete-item { background: none; border: none; color: #e53e3e; cursor: pointer; font-size: 1.1rem; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .btn-export { flex: 1; background-color: #10b981; color: white; border: none; border-radius: 10px; padding: 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
        .btn-copy { flex: 1; background-color: #8b5cf6; color: white; border: none; border-radius: 10px; padding: 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
        .btn-clear { background-color: #4a5568; color: white; border: none; border-radius: 12px; padding: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
        .empty-msg { text-align: center; color: #a0aec0; font-size: 0.85rem; padding: 15px 0; }
        .badge-green { color: #38a169; } .badge-red { color: #e53e3e; }
    </style>
</head>
<body>

<div class="card">
    <div class="title-container">
        <span class="title-icon">⏰</span>
        <h1>ثبت ورود و خروج</h1>
    </div>

    <!-- تاریخ -->
    <div class="form-group">
        <div class="label-row">
            <label>📅 تاریخ شمسی</label>
            <button type="button" class="quick-btn" onclick="setCurrentDate()">درج تاریخ امروز</button>
        </div>
        <input type="text" id="dateInput" placeholder="1405/07/12" dir="ltr">
    </div>

    <!-- ساعت ورود -->
    <div class="form-group">
        <div class="label-row">
            <label><span class="badge-green">🟢</span> ساعت ورود</label>
            <button type="button" class="quick-btn" onclick="setCurrentTime('entryInput')">زمان کنونی</button>
        </div>
        <input type="time" id="entryInput">
    </div>

    <!-- ساعت خروج -->
    <div class="form-group">
        <div class="label-row">
            <label><span class="badge-red">🔴</span> ساعت خروج</label>
            <button type="button" class="quick-btn" onclick="setCurrentTime('exitInput')">زمان کنونی</button>
        </div>
        <input type="time" id="exitInput">
    </div>

    <button type="button" class="btn-submit" onclick="saveRecord()">💾 ثبت اطلاعات</button>

    <div class="history-section">
        <div class="history-title">
            <span>📋 سوابق ثبت شده</span>
            <span id="recordCount" style="font-size: 0.8rem; color: #718096;">(۰ مورد)</span>
        </div>
        <div class="history-list" id="historyList">
            <div class="empty-msg">هیچ سابقه‌ای ثبت نشده است</div>
        </div>

        <!-- دکمه‌های خروجی گرفتن -->
        <div class="btn-group">
            <button type="button" class="btn-export" onclick="exportToCSV()">📊 دانلود اکسل</button>
            <button type="button" class="btn-copy" onclick="copyHistoryText()">📋 کپی متن</button>
        </div>
    </div>

    <button type="button" class="btn-clear" onclick="clearAllRecords()">🗑️ پاک کردن همه سوابق</button>
</div>

<script>
    function toEnglishDigits(str) {
        if (!str) return '';
        return String(str).replace(/[۰-۹]/g, function(w) {
            var persian = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return persian.indexOf(w);
        });
    }

    function toPersianDigits(str) {
        if (!str) return '';
        return String(str).replace(/[0-9]/g, function(w) {
            var persian = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return persian[w];
        });
    }

    function getTodayJalali() {
        try {
            const today = new Date();
            const formatter = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year: 'numeric', month: '2-digit', day: '2-digit' });
            const parts = formatter.formatToParts(today);
            let year, month, day;
            parts.forEach(p => {
                if (p.type === 'year') year = p.value;
                if (p.type === 'month') month = p.value;
                if (p.type === 'day') day = p.value;
            });
            return `${toEnglishDigits(year)}/${toEnglishDigits(month)}/${toEnglishDigits(day)}`;
        } catch (e) {
            return "1405/07/12";
        }
    }

    function setCurrentDate() {
        document.getElementById('dateInput').value = getTodayJalali();
    }

    function setCurrentTime(inputId) {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById(inputId).value = `${hours}:${minutes}`;
    }

    function saveRecord() {
        let dateVal = document.getElementById('dateInput').value.trim();
        const entryVal = document.getElementById('entryInput').value;
        const exitVal = document.getElementById('exitInput').value;

        dateVal = toEnglishDigits(dateVal);

        if (!dateVal) {
            alert('لطفاً تاریخ را وارد کنید.');
            return;
        }

        const newRecord = {
            id: Date.now(),
            date: dateVal,
            entry: entryVal || '--:--',
            exit: exitVal || '--:--'
        };

        let records = JSON.parse(localStorage.getItem('attendance_records') || '[]');
        records.unshift(newRecord);
        localStorage.setItem('attendance_records', JSON.stringify(records));

        renderHistory();
        document.getElementById('entryInput').value = '';
        document.getElementById('exitInput').value = '';
    }

    function deleteRecord(id) {
        let records = JSON.parse(localStorage.getItem('attendance_records') || '[]');
        records = records.filter(r => r.id !== id);
        localStorage.setItem('attendance_records', JSON.stringify(records));
        renderHistory();
    }

    function clearAllRecords() {
        if (confirm('آیا از پاک کردن تمام سوابق اطمینان دارید؟')) {
            localStorage.removeItem('attendance_records');
            renderHistory();
        }
    }

    function renderHistory() {
        const records = JSON.parse(localStorage.getItem('attendance_records') || '[]');
        const listEl = document.getElementById('historyList');
        const countEl = document.getElementById('recordCount');

        countEl.textContent = `(${toPersianDigits(records.length)} مورد)`;

        if (records.length === 0) {
            listEl.innerHTML = '<div class="empty-msg">هیچ سابقه‌ای ثبت نشده است</div>';
            return;
        }

        listEl.innerHTML = records.map(r => `
            <div class="history-item">
                <div style="display:flex; flex-direction:column; gap:2px;">
                    <span style="font-weight:700;">📅 ${toPersianDigits(r.date)}</span>
                    <span style="color:#718096; font-size:0.8rem;">
                        🟢 ورود: ${toPersianDigits(r.entry)} | 🔴 خروج: ${toPersianDigits(r.exit)}
                    </span>
                </div>
                <button class="btn-delete-item" onclick="deleteRecord(${r.id})">🗑️</button>
            </div>
        `).join('');
    }

    // خروجی اکسل (فایل CSV)
    function exportToCSV() {
        const records = JSON.parse(localStorage.getItem('attendance_records') || '[]');
        if (records.length === 0) {
            alert('سابقه‌ای برای خروجی وجود ندارد.');
            return;
        }

        let csvContent = "\uFEFF"; // برای نمایش درست حروف فارسی در اکسل
        csvContent += "تاریخ,زمان ورود,زمان خروج\n";

        records.forEach(r => {
            csvContent += `"${r.date}","${r.entry}","${r.exit}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `attendance_export_${getTodayJalali().replace(/\//g, '-')}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // کپی کردن سوابق به صورت متن
    function copyHistoryText() {
        const records = JSON.parse(localStorage.getItem('attendance_records') || '[]');
        if (records.length === 0) {
            alert('سابقه‌ای برای کپی وجود ندارد.');
            return;
        }

        let text = "📋 گزارش ورود و خروج:\n\n";
        records.forEach((r, index) => {
            text += `${index + 1}. تاریخ: ${r.date} | ورود: ${r.entry} | خروج: ${r.exit}\n`;
        });

        navigator.clipboard.writeText(text).then(() => {
            alert('سوابق با موفقیت در حافظه کپی شد! می‌توانید آن را در تلگرام، واتساپ یا نوت گوشی پیست (Paste) کنید.');
        }).catch(() => {
            alert('خطا در کپی کردن متن.');
        });
    }

    window.onload = function() {
        setCurrentDate();
        renderHistory();
    };
</script>

</body>
</html>
